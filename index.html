<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="QuoteAI — prototipo v1 de cotizador con IA para equipamiento gastronómico">
<title>QuoteAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar shell (desktop) / bottom bar (mobile); paper-white A4 sheet for the quotation itself */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaeee9; --ink:#17211d; --muted:#56635c; --line:#d6ddd7;
  --accent:#0d5a50; --accent-ink:#ffffff; --accent-soft:#dfeeea; --accent-hover:#0a4a42;
  --ai:#8a4600; --ai-soft:#fdf1df; --ai-line:#eec58a;
  --ok:#1b6a3b; --ok-soft:#e1f2e6; --info:#24508f; --info-soft:#e3ecf8; --bad:#a3271f; --bad-soft:#f9e3e1; --neutral-soft:#e8ebe8;
  --lock-bg:#eef0f3; --lock-ink:#3f4a57;
  --paper:#ffffff; --paper-ink:#1d2421; --paper-muted:#5d6762; --paper-line:#d9dfdb; --paper-band:#eef2ef; --paper-accent:#0d5a50;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --f-display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201c; --surface-2:#202a25; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
  --accent:#5cc2b0; --accent-ink:#06201b; --accent-soft:#163a34; --accent-hover:#7dd3c3;
  --ai:#f0b25c; --ai-soft:#30240f; --ai-line:#6a4a1c;
  --ok:#72d29c; --ok-soft:#163222; --info:#93b6ef; --info-soft:#18263b; --bad:#f2918a; --bad-soft:#3b1a18; --neutral-soft:#26302b;
  --lock-bg:#1f252d; --lock-ink:#b8c3d0; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201c; --surface-2:#202a25; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
  --accent:#5cc2b0; --accent-ink:#06201b; --accent-soft:#163a34; --accent-hover:#7dd3c3;
  --ai:#f0b25c; --ai-soft:#30240f; --ai-line:#6a4a1c;
  --ok:#72d29c; --ok-soft:#163222; --info:#93b6ef; --info-soft:#18263b; --bad:#f2918a; --bad-soft:#3b1a18; --neutral-soft:#26302b;
  --lock-bg:#1f252d; --lock-ink:#b8c3d0; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.15rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
.ic-sm{width:14px;height:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;min-height:42px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side .btn.primary{margin:4px 0 14px;justify-content:center}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.side-foot b{color:var(--ink);font-weight:600;display:block}
main{min-width:0;padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.bottombar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottombar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;min-height:48px;justify-content:center}
  .bottombar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .bottombar .fab{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow)}
  .bottombar .fab .ic{width:24px;height:24px}
  h1{font-size:1.4rem}
}

/* generic */
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:42px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ai{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-body{padding:18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.78rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:42px}
textarea.input{min-height:120px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.err-text{color:var(--bad);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.st-Borrador{background:var(--neutral-soft);color:var(--muted)}
.st-Enviada{background:var(--info-soft);color:var(--info)}
.st-Aceptada{background:var(--ok-soft);color:var(--ok)}
.st-Rechazada{background:var(--bad-soft);color:var(--bad)}
.cf-alta{background:var(--ok-soft);color:var(--ok)}
.cf-media{background:var(--ai-soft);color:var(--ai)}
.cf-baja{background:var(--neutral-soft);color:var(--muted)}
.ai-tag{display:inline-flex;align-items:center;gap:4px;color:var(--ai);font-size:.75rem;font-weight:600}
.ai-box{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:var(--r);padding:14px 16px}
.lock{background:var(--lock-bg);color:var(--lock-ink);border-radius:var(--r);padding:14px 16px;border:1px dashed color-mix(in srgb,var(--lock-ink) 35%,transparent)}
.lock-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .val{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.kpi.locked{background:var(--lock-bg);color:var(--lock-ink)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:118px minmax(0,1.6fr) 104px 130px 132px auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow.head{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-block:9px;background:var(--surface-2)}
.qrow .client{min-width:0}
.qrow .client b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .client small{color:var(--muted)}
.status-sel{appearance:none;border:0;border-radius:99px;padding:5px 26px 5px 11px;font-size:.78rem;font-weight:600;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;min-height:30px}
.qactions{display:flex;gap:2px;justify-content:flex-end}
@media (max-width:900px){
  .qrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c t" "n s" "d a";gap:6px 12px;padding:14px 16px}
  .qrow.head{display:none}
  .qrow .q-num{grid-area:n}.qrow .client{grid-area:c}.qrow .q-date{grid-area:d}.qrow .q-total{grid-area:t}.qrow .q-st{grid-area:s;justify-self:end}.qrow .qactions{grid-area:a}
}

/* wizard */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:52px;min-width:0}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--surface-2);color:var(--muted);flex:none}
.step b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step small{color:var(--muted);font-size:.74rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step span{min-width:0}
.step[aria-current="step"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{cursor:not-allowed;opacity:.55}
.stepper-mobile{display:none}
@media (max-width:860px){.stepper{display:none}.stepper-mobile{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stepper-mobile .dots{display:flex;gap:5px}.stepper-mobile .dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}.stepper-mobile .dots i.on{background:var(--accent)}}
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.wiz-body{display:flex;flex-direction:column;gap:18px;min-width:0}
.summary{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.summary .rowx{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.summary .total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:1.1rem}
@media (max-width:1100px){.wiz{grid-template-columns:minmax(0,1fr)}.summary{display:none}}
.wiz-nav{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.wiz.full{grid-template-columns:minmax(0,1fr)}.wiz.full .summary{display:none}
@media (max-width:520px){.wiz-nav [data-act="back"] span{display:none}.kpi .val{font-size:1.3rem}.wiz-nav .btn{padding:9px 11px}}
.wiz-nav .mini{white-space:nowrap;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.wiz-nav .mini b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.wiz-nav .mini small{color:var(--muted);font-size:.75rem}
@media (max-width:860px){.wiz-nav{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px;cursor:pointer;text-align:left;min-height:48px;font-weight:500;display:flex;align-items:center;gap:8px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .opt{padding:8px 13px;min-height:42px;border-radius:99px}
.qsec{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.qsec:first-child{padding-top:0}.qsec:last-child{border-bottom:0;padding-bottom:0}
.typeahead{position:relative}
.ta-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.ta-list button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:10px 12px;border:0;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);min-height:44px}
.ta-list button:last-child{border-bottom:0}
.ta-list button:hover{background:var(--surface-2)}
.qcard{border:1px solid var(--ai-line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.qcard .why{font-size:.8rem;color:var(--ai)}
.thinking{display:flex;align-items:center;gap:14px;padding:26px;border-radius:var(--r);background:var(--ai-soft);border:1px solid var(--ai-line);color:var(--ai);font-weight:600}
.dots3{display:inline-flex;gap:4px}.dots3 i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.1s infinite}
.dots3 i:nth-child(2){animation-delay:.18s}.dots3 i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.pgroup{display:flex;flex-direction:column}
.pgroup h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 0 8px}
.pline{display:grid;grid-template-columns:28px minmax(0,1fr) 74px 120px 120px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.pline.off{opacity:.62}
.pline input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.pline .nm{font-weight:600}
.pline .reason{font-size:.83rem;color:var(--ai);margin-top:4px;display:flex;gap:6px;align-items:flex-start}
@media (max-width:640px){.pline{grid-template-columns:28px minmax(0,1fr) auto;}.pline .c-price{display:none}.pline .c-qty{grid-column:2}.pline .c-total{grid-column:3}}

/* review lines */
.lines{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 112px 88px 120px 118px 36px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.lrow.head{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.lrow.dragging{opacity:.4}.lrow.over{box-shadow:inset 0 2px 0 var(--accent)}
.lrow .grip{cursor:grab;color:var(--muted);display:grid;place-items:center}
.lrow .input{min-height:36px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.lrow .nm{font-weight:600;line-height:1.3}
.lrow .meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.lrow .internal{background:var(--lock-bg);border-radius:6px;padding:4px 6px;color:var(--lock-ink)}
.lrow .internal .input{background:transparent;border-style:dashed}
.th-lock{display:inline-flex;align-items:center;gap:3px;justify-content:flex-end}
.mlabel{display:none}
@media (max-width:900px){
  .lrow.head{display:none}
  .lrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"p p" "q pr" "c m" "t t";gap:8px 12px;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r)}
  .lrow .grip{display:none}.lrow .c-p{grid-area:p;padding-right:34px;position:relative}.lrow .c-q{grid-area:q}.lrow .c-pr{grid-area:pr}.lrow .c-c{grid-area:c}.lrow .c-m{grid-area:m}.lrow .c-t{grid-area:t;text-align:right;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
  .lrow .c-del{position:absolute;margin-left:auto;grid-area:p;justify-self:end;align-self:start}
  .mlabel{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:3px}
  .lines{gap:0}
}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}

details.conv summary{cursor:pointer;font-weight:600;color:var(--ai);list-style:none;display:flex;gap:6px;align-items:center}
details.conv summary::-webkit-details-marker{display:none}
.conv-item{padding:8px 0;border-bottom:1px solid var(--ai-line);font-size:.86rem}
.conv-item:last-child{border-bottom:0}

/* catalog */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);cursor:pointer}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.tablewrap{overflow-x:auto;border-radius:0 0 var(--r) var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{position:sticky;top:0;text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 12px;font-weight:600;white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.t tr.bad td{background:var(--bad-soft)}
table.t tr.inactive td{color:var(--muted)}
table.t td .input{min-height:34px;padding:5px 8px;min-width:90px}
.maprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.maprow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toggle{position:relative;width:40px;height:24px;flex:none;appearance:none;background:var(--line);border-radius:99px;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle:checked{background:var(--accent)}.toggle:checked::after{left:19px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,16,13,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pick{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:860px){.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}

/* A4 sheet */
.sheets{display:flex;flex-direction:column;align-items:center;gap:22px;overflow-x:auto;padding:4px 0 10px}
.sheet{width:794px;height:1123px;background:var(--paper);color:var(--paper-ink);box-shadow:0 2px 14px rgba(0,0,0,.14);padding:52px 56px 46px;display:flex;flex-direction:column;font-size:11.5px;line-height:1.4;flex:none;color-scheme:light}
.sh-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:16px;border-bottom:2px solid var(--paper-accent)}
.sh-logo{display:flex;align-items:center;gap:10px}
.sh-logo img{max-height:56px;max-width:170px}
.sh-mark{width:46px;height:46px;border-radius:10px;background:var(--paper-accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.sh-co{text-align:right;color:var(--paper-muted)}
.sh-co b{color:var(--paper-ink);font-size:13px;display:block}
.sh-title{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 0 14px}
.sh-title h2{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;color:var(--paper-accent)}
.sh-client{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px;background:var(--paper-band);padding:12px 14px;border-radius:6px}
.sh-client span{color:var(--paper-muted);display:inline-block;min-width:74px}
.sh-table{width:100%;border-collapse:collapse;margin-top:12px}
.sh-table th{background:var(--paper-accent);color:#fff;font-weight:600;text-align:left;padding:6px 7px;font-size:10.5px}
.sh-table td{padding:6px 7px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.sh-table .cat td{background:var(--paper-band);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-accent)}
.sh-table .d{color:var(--paper-muted);font-size:10.5px}
.sh-tot{margin-left:auto;width:290px;margin-top:14px}
.sh-tot div{display:flex;justify-content:space-between;padding:3px 0}
.sh-tot .g{border-top:1.5px solid var(--paper-ink);margin-top:4px;padding-top:6px;font-weight:700;font-size:13px}
.sh-words{margin-top:10px;padding:8px 10px;border:1px solid var(--paper-line);border-radius:5px;font-weight:600;font-size:10.5px}
.sh-terms{margin-top:14px;display:grid;grid-template-columns:150px 1fr;gap:3px 12px}
.sh-terms dt{color:var(--paper-muted)}.sh-terms dd{margin:0}
.sh-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--paper-line);display:flex;justify-content:space-between;gap:16px;color:var(--paper-muted);font-size:10px}

const pricing = {
  convert(cost, from, to, rate) { if (from === to) return round2(cost); return to === "PEN" ? round2(cost * rate) : round2(cost / rate); },
  unitPrice(unitCost, margin) { return round2(unitCost * (1 + margin / 100)); },
  marginFrom(unitPrice, unitCost) { return unitCost ? (unitPrice / unitCost - 1) * 100 : 0; },
  recalcLine(q, l) {
    l.unitCost = pricing.convert(l.listCost, l.listCurrency, q.currency, q.exchangeRate);
    l.margin = l.marginOverride != null ? l.marginOverride : q.defaultMargin;
    l.unitPrice = pricing.unitPrice(l.unitCost, l.margin);
    l.lineTotal = round2(l.quantity * l.unitPrice);
    return l;
  },
  recalc(q) { q.lines.forEach(l => pricing.recalcLine(q, l)); return q; },
  totals(q, lines = q.lines) {
    const igvPct = DB.settings.igv;
    const subtotal = round2(lines.reduce((s, l) => s + l.lineTotal, 0));
    const descuento = round2(subtotal * (q.discount || 0) / 100);
    const valorVenta = round2(subtotal - descuento);
    const igv = round2(valorVenta * igvPct / 100);
    const total = round2(valorVenta + igv);
    const totalCost = round2(lines.reduce((s, l) => s + l.quantity * l.unitCost, 0));
    const profit = round2(valorVenta - totalCost);
    const avgMargin = totalCost ? profit / totalCost * 100 : 0;
    return { subtotal, descuento, valorVenta, igv, igvPct, total, totalCost, profit, avgMargin, items: lines.reduce((s, l) => s + l.quantity, 0) };
  },
};

/* ============ importe en letras ============ */
function numeroALetras(n) {
  const U = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE", "DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISÉIS", "DIECISIETE", "DIECIOCHO", "DIECINUEVE",
    "VEINTE", "VEINTIUNO", "VEINTIDÓS", "VEINTITRÉS", "VEINTICUATRO", "VEINTICINCO", "VEINTISÉIS", "VEINTISIETE", "VEINTIOCHO", "VEINTINUEVE"];
  const D = ["", "", "", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
  const C = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];
  const dec = x => (x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? " Y " + U[x % 10] : ""));
  const cen = x => (x === 100 ? "CIEN" : ((C[Math.floor(x / 100)] + " " + dec(x % 100)).trim()));
  const apoc = s => s.replace(/VEINTIUNO$/, "VEINTIÚN").replace(/UNO$/, "UN");
  function words(x) {
    if (x === 0) return "CERO";
    const mill = Math.floor(x / 1e6), miles = Math.floor((x % 1e6) / 1000), rest = x % 1000;
    let out = [];
    if (mill) out.push(mill === 1 ? "UN MILLÓN" : apoc(words(mill)) + " MILLONES");
    if (miles) out.push(miles === 1 ? "MIL" : apoc(cen(miles)) + " MIL");
    if (rest) out.push(cen(rest));
    return out.join(" ");
  }
  return words(n);
}
function importeEnLetras(total, cur) {
  const ent = Math.floor(round2(total)), cts = Math.round((round2(total) - ent) * 100);
  return `SON: ${numeroALetras(ent)} CON ${String(cts).padStart(2, "0")}/100 ${cur === "USD" ? "DÓLARES AMERICANOS" : "SOLES"}`;
}

const aiDelay = () => new Promise(r => setTimeout(r, 800 + Math.random() * 700));

function detectCategories(ctx) {
  const t = ctx.template, set = new Set(ctx.chips || []);
  const txt = (ctx.needsText || "").toLowerCase();
  t.keywordRules.forEach(r => { if (new RegExp(r.re, "i").test(txt)) set.add(r.cat); });
  if (!set.size) (t.businessDefaults[ctx.profile.businessType] || ["Cocción", "Refrigeración"]).forEach(c => set.add(c));
  return [...set];
}
function energyMode(ctx) {
  const a = ctx.answers.gas, e = ctx.profile.energy;
  if (a && a !== "__skip") { if (/gas/i.test(a) && !/^No/i.test(a)) return "gas"; if (/electric/i.test(a)) return "electrico"; }
  if (e === "Gas GLP" || e === "Gas natural") return "gas";
  if (e === "Solo electricidad") return "electrico";
  if (e === "Mixto") return "mixto";
  return "unknown";
}
function voltageOf(ctx) {
  const v = (ctx.answers.voltaje && ctx.answers.voltaje !== "__skip") ? ctx.answers.voltaje : ctx.profile.electricity || "";
  if (/380/.test(v)) return "380"; if (/220/.test(v)) return "220"; return "unknown";
}
const ans = (ctx, id) => { const v = ctx.answers[id]; return v === "__skip" || v == null ? null : v; };
const has = (v, s) => Array.isArray(v) ? v.includes(s) : v === s;

}

function mockRecommend(ctx) {
  const P = ctx.profile, cats = detectCategories(ctx);
  const cap = +P.capacity || +ans(ctx, "capacity") || 0;
  const tipo = (P.businessType || "negocio").replace("/", " o ").toLowerCase();
  const mode = energyMode(ctx), volt = voltageOf(ctx), budget = +P.budget || 0;
  const base = cap && mode !== "unknown" ? "alta" : "media";
  const eLabel = { gas: P.energy === "Gas natural" || /natural/.test(ctx.answers.gas || "") ? "gas natural" : "gas GLP", electrico: "energía eléctrica", mixto: "energía mixta", unknown: "energía por confirmar" }[mode];
  const reason = m => cap ? `Recomendado por ${m} para ${tipo} de ${cap} personas.` : `Recomendado por ${m} para ${tipo}.`;
  const lines = [], unc = [];
  const costPEN = p => p.currency === "PEN" ? p.cost : p.cost * DB.settings.exchangeRate;
  function pick(roles, o = {}) {
    for (const role of [].concat(roles)) {
      let c = ctx.catalog.filter(p => p.active && (p.tags || []).includes(role));
      const en = p => (p.attributes || {}).energy;
      if (mode === "electrico") c = c.filter(p => en(p) !== "gas");
      if (mode === "gas" && o.energy) c = c.filter(p => en(p) !== "eléctrico");
      if (volt === "220") c = c.filter(p => (p.attributes || {}).voltage !== "380V");
      if (!c.length) continue;
      c.sort((a, b) => costPEN(a) - costPEN(b));
      if (mode === "mixto" || mode === "unknown") { const g = c.filter(p => en(p) === "gas"); if (o.energy && g.length) c = g; }
      const big = !budget && (o.prefer === "max" || cap > 150);
      return big ? c[c.length - 1] : c[0];
    }
    return null;
  }
  function add(roles, qty, motivo, o = {}) {
    const p = pick(roles, o);
    if (!p) { if (o.missing) unc.push(o.missing); return null; }
    if (lines.some(l => l.productId === p.id)) return p;
    let conf = o.conf || base;
    if (conf === "alta" && volt === "unknown" && (p.attributes || {}).voltage === "380V") conf = "media";
    lines.push({ productId: p.id, quantity: Math.max(1, qty), reason: reason(motivo), confidence: conf, category: p.category });
    return p;

    else if (cap > 120) add("cocina-6", 2, `aforo mayor a 120 personas y uso de ${eLabel}`, { energy: true, missing: "No hay cocina de 6 hornillas en tu catálogo" });
    else if (cap > 50) add("cocina-6", 1, `uso de ${eLabel}`, { energy: true, missing: "No hay cocina de 6 hornillas en tu catálogo" });
    else add(["cocina-4", "cocina-6"], 1, `uso de ${eLabel}`, { energy: true, missing: "No hay cocina industrial en tu catálogo" });
    if (has(prep, "Frituras") || bt === "Pollería" || bt === "Dark kitchen") add("freidora", cap > 120 ? 2 : 1, "preparaciones con frituras", { energy: true });
    if (has(prep, "Plancha")) add("plancha", 1, "preparaciones a la plancha", { energy: true });
    const horno = ans(ctx, "horno");
    if (has(prep, "Horno") && horno !== "El horno de la cocina es suficiente") {
      if (horno && /combinado/.test(horno)) { if (!add("horno-combi", 1, "horneado con vapor y convección", { energy: true })) add("horno-conv", 1, "horneado (no hay horno combinado compatible con tu energía)", { energy: true, conf: "media", missing: "No hay horno compatible con la energía disponible" }); }
      else add(["horno-conv", "horno-combi"], 1, "preparaciones al horno", { energy: true, conf: horno ? base : "media" });
    }
    if (has(prep, "Wok / salteados") || bt === "Chifa") add("wok", cap > 100 ? 2 : 1, "salteados al wok", { energy: true, missing: mode === "electrico" ? "No hay cocina wok eléctrica en tu catálogo" : "No hay cocina wok en tu catálogo" });
    if (has(prep, "Guisos y sopas")) add("marmita", 1, "volumen de guisos y sopas", { energy: true, conf: cap >= 100 ? base : "baja" });
    if (has(prep, "Pollo a la brasa") || bt === "Pollería") add("brasa", Math.max(1, Math.ceil(cap / 80)), "producción de pollo a la brasa (1 horno cada 80 personas)");
    if (has(P.service, "Buffet")) add("bano-maria", Math.max(1, Math.ceil(cap / 60)), "servicio de buffet");
    if (has(P.service, "Carta") && mode !== "electrico") add("salamandra", 1, "acabado y gratinado de platos a la carta", { energy: true, conf: "baja" });
  }
  if (cats.includes("Refrigeración")) {
    const formato = ans(ctx, "formato") || "Refrigeradora vertical", n = Math.max(1, Math.ceil((cap || 60) / 60));
    if (formato !== "Mesa refrigerada") add(cap && cap <= 40 ? ["ref-1p", "ref-2p"] : ["ref-2p", "ref-1p"], n, "conservación de insumos (1 equipo por cada 60 personas)", { missing: "No hay refrigeradora vertical en tu catálogo" });
    if (formato !== "Refrigeradora vertical") add("mesa-ref", formato === "Ambas" ? 1 : Math.max(1, Math.ceil((cap || 60) / 80)), "frío al alcance de la línea de trabajo");

    else { add(["amasadora-g", "amasadora"], h === "Más de 50 kg" ? 2 : 1, `proceso de ${h.toLowerCase()} de harina al día`, { conf: hc }); add(["horno-rot", "horno-piso"], 1, "horneado de producción media o alta", { energy: true, conf: hc, missing: "No hay horno de panadería compatible con tu energía" }); }
    add("batidora", 1, "masas batidas y cremas de pastelería");
    add("fermentacion", 1, "control de fermentación de la masa", { conf: "media" });
    add("divisora", 1, "porcionado uniforme de la masa", { conf: "media" });
    add("carro-pan", 2, "traslado de bandejas entre fermentación y horno", { conf: "media" });
    add("laminadora", 1, "hojaldres y masas laminadas", { conf: "baja" });
  }
  if (cats.includes("Lavado")) {
    const lv = ans(ctx, "lavado") || (cap > 100 ? "Lavavajillas de capota" : "Manual (pozas)");
    const lc = ans(ctx, "lavado") ? base : "media";
    if (lv === "Lavavajillas de capota") { add(["lavavajillas-cap", "lavavajillas-bm"], 1, "volumen alto de vajilla por turno", { conf: volt === "220" ? "media" : lc }); add("lavadero-2", 1, "pre-lavado y lavado de ollas"); add("ducha", 1, "pre-lavado de vajilla"); }
    else if (lv === "Lavavajillas bajo mesa") { add("lavavajillas-bm", 1, "lavado mecánico en espacio reducido", { conf: lc }); add("lavadero-1", 1, "pre-lavado y lavado de ollas"); }
    else { add("lavadero-2", Math.max(1, Math.ceil((cap || 50) / 100)), "lavado manual de vajilla y ollas", { conf: lc }); add("ducha", 1, "pre-lavado de vajilla", { conf: "media" }); }

  if (cats.includes("Cafetería")) {
    const cf = ans(ctx, "cafe");
    add("espresso", 1, cf ? `servicio de ${cf.toLowerCase()} tazas al día` : "servicio de café espresso", { prefer: cf === "Más de 300" ? "max" : "min", conf: cf ? base : "media" });

  if (/silla|sal[oó]n|comensal/.test(t) && /mesa|silla/.test(t)) unc.push("No hay mobiliario de salón (mesas y sillas para comensales) en tu catálogo");
  if (/agua|ablandador|filtro/.test(t)) unc.push("No hay sistemas de tratamiento de agua en tu catálogo");
  cats.forEach(c => { if (!ctx.catalog.some(p => p.active && p.category === c)) unc.push(`No hay productos activos de ${c} en tu catálogo`); });

  return { lines, uncoveredNeeds: [...new Set(unc)], summary };

function viewDashboard() {

  const month = qs.filter(q => { const d = new Date(q.createdAt); return d.getMonth() === m && d.getFullYear() === y; });
  const tot = q => pricing.totals(q);

  const nonDraft = month.filter(q => q.status !== "Borrador");

  const acc = month.filter(q => q.status === "Aceptada").length, dec = month.filter(q => ["Enviada", "Aceptada", "Rechazada"].includes(q.status)).length;
  const conv = dec ? acc / dec * 100 : 0;
  const withLines = month.filter(q => q.lines.length);
  const costSum = withLines.reduce((s, q) => s + tot(q).totalCost * (q.currency === "USD" ? q.exchangeRate : 1), 0);
  const profitSum = withLines.reduce((s, q) => s + tot(q).profit * (q.currency === "USD" ? q.exchangeRate : 1), 0);
  const avgM = costSum ? profitSum / costSum * 100 : 0;

      <span class="qactions"><button class="iconbtn" title="Abrir" aria-label="Abrir" data-act="open-quote" data-id="${q.id}">${I.open}</button><button class="iconbtn" title="Duplicar" aria-label="Duplicar" data-act="dup-quote" data-id="${q.id}">${I.copy}</button><button class="iconbtn" title="Descargar PDF" aria-label="Descargar PDF" data-act="pdf-quote" data-id="${q.id}" ${q.lines.length ? "" : "disabled"}>${I.download}</button></span>
    </div>`;
  }).join("");
  return `<header class="pagehead"><div><p class="eyebrow">${esc(fmtDateLong(now.toISOString()))}</p><h1>Hola, ${esc(DB.settings.seller.split(" ")[0])}</h1></div><a class="btn primary" href="#nueva">${I.plus}Nueva cotización</a></header>
  ${hasCatalog() ? "" : emptyCatalogCta()}
  <section class="kpis" aria-label="Indicadores de ${monthName}">
    <div class="kpi"><span class="lbl">Cotizaciones de ${monthName}</span><span class="val">${month.length}</span><span class="sub">${month.filter(q => q.status === "Borrador").length} en borrador · ${nonDraft.length} emitidas</span></div>
    <div class="kpi"><span class="lbl">Monto cotizado</span><span class="val">S/ ${NF0.format(amount)}</span><span class="sub">Con IGV, sin borradores, USD convertidos a soles</span></div>
    <div class="kpi"><span class="lbl">Tasa de conversión</span><span class="val">${pct(conv)}</span><div class="bar" aria-hidden="true"><i style="width:${Math.min(100, conv)}%"></i></div><span class="sub">${acc} aceptadas de ${dec} enviadas, aceptadas o rechazadas</span></div>
    <div class="kpi locked"><span class="lbl">Margen promedio ${lockTag()}</span><span class="val">${pct(avgM)}</span><span class="sub">Utilidad bruta sobre costo, después de descuentos</span></div>
  </section>

    <div class="qlist"><div class="qrow head"><span>Número</span><span>Cliente</span><span>Fecha</span><span class="num">Total</span><span>Estado</span><span></span></div>${rows || `<div class="panel-body muted">Aún no tienes cotizaciones. Crea la primera con “Nueva cotización”.</div>`}</div>
  </section>`;

function validateStep(n) {
  errors = {};
  if (n === 1) {
    const c = W.client;
    if (!c.name.trim()) errors.name = "Ingresa la razón social o el nombre.";
    if (!c.phone.trim() && !c.email.trim()) errors.contact = "Ingresa un teléfono o un email.";
    const d = c.documentNumber.trim();
    if (d && !(c.documentType === "RUC" ? /^\d{11}$/ : /^\d{8}$/).test(d)) errors.doc = c.documentType === "RUC" ? "El RUC tiene 11 dígitos." : "El DNI tiene 8 dígitos.";
  }
  if (n === 2 && !W.businessProfile.businessType) errors.businessType = "Elige el tipo de negocio.";
  return !Object.keys(errors).length;
}
function persistClient() {
  const c = W.client; if (!c.id) c.id = uid();
  store.clients.upsert(clone(c)); W.clientId = c.id;
}
function setStep(n) { W.step = n; W.maxStep = Math.max(W.maxStep, n); store.quotes.upsert(W); render(); window.scrollTo(0, 0); }
function applyProposal() {
  const keep = W.lines.filter(l => l.source === "manual");
  const add = W.aiProposal.lines.filter(l => l.selected).map(l => { const p = store.products.get(l.productId); return p ? makeLine(W, p, l.quantity, { source: "ai", reason: l.reason, confidence: l.confidence }) : null; }).filter(Boolean);
  W.lines = add.concat(keep); W.stale = false;
}
function ctxFor() {
  return { template: DB.template, profile: W.businessProfile, needsText: W.needsText, chips: W.chips, answers: W.aiAnswers, round: W.aiRound,
    catalog: DB.products.filter(p => p.active) };
}
async function runAnalyze() {
  busy = true; W.aiRound = 1; W.aiAnswers = {}; W.aiConversation = []; render();
  const res = await aiService.getClarifyingQuestions(ctxFor());
  W.aiPending = res.questions; W.aiConversation.push({ round: 1, at: new Date().toISOString(), questions: res.questions, answers: null });
  W.ui3 = "b"; busy = false; store.quotes.upsert(W); render();
}
async function runPropose() {
  const last = W.aiConversation[W.aiConversation.length - 1];
  if (last) last.answers = Object.fromEntries((W.aiPending || []).map(q => [q.id, W.aiAnswers[q.id] ?? "__skip"]));
  (W.aiPending || []).forEach(q => { if (W.aiAnswers[q.id] == null) W.aiAnswers[q.id] = "__skip"; });
  if (W.aiRound === 1) {
    busy = "La IA está revisando tus respuestas…"; render();
    W.aiRound = 2;
    const res = await aiService.getClarifyingQuestions(ctxFor());
    if (res.questions.length) { W.aiPending = res.questions; W.aiConversation.push({ round: 2, at: new Date().toISOString(), questions: res.questions, answers: null }); busy = false; W.ui3 = "b"; store.quotes.upsert(W); render(); return; }
  }
  await runRecommend();
}
async function runRecommend() {
  busy = "La IA está armando la propuesta…"; render();
  const res = await aiService.recommendProducts(ctxFor());
  res.lines.forEach(l => (l.selected = l.confidence !== "baja"));
  W.aiProposal = res; W.aiPending = null; W.stale = false; W.ui3 = "c"; busy = false;
  W.aiConversation.push({ round: "propuesta", at: new Date().toISOString(), questions: [], answers: null, summary: res.summary });
  store.quotes.upsert(W); render();
}

const MAP_FIELDS = [["sku", "Código / SKU", true, /^(sku|c[oó]d(igo)?\.?|item|code)$/i], ["name", "Nombre", true, /^(nombre|producto|descripci[oó]n|name)$/i], ["description", "Descripción", false, /(detalle|descripci[oó]n larga|caracter|description)/i],
  ["category", "Categoría", false, /categor/i], ["brand", "Marca", false, /(marca|brand)/i], ["unit", "Unidad", false, /^(unidad|und|um|u\.m\.)$/i], ["cost", "Costo", true, /(costo|precio|cost|price)/i], ["currency", "Moneda", false, /(moneda|divisa|currency)/i]];
function parseNum(v) {
  if (typeof v === "number") return v;
  let s = String(v ?? "").replace(/[^\d.,-]/g, "");
  if (!s) return NaN;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > ld) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, "");
  return parseFloat(s);
}
function normCur(v) { const s = String(v ?? "").trim().toUpperCase(); if (!s) return DB.settings.defaultCurrency || "PEN"; if (/^(PEN|S\/|SOLES?)$/.test(s)) return "PEN"; if (/^(USD|US\$|\$|D[OÓ]LAR(ES)?)$/.test(s)) return "USD"; return null; }
function mappedRows() {
  const m = CAT.mapping;
  return CAT.rows.map((r, i) => {
    const get = k => m[k] != null && m[k] !== "" ? r[m[k]] : "";
    const errs = [];
    const sku = String(get("sku") ?? "").trim(), name = String(get("name") ?? "").trim(), cost = parseNum(get("cost")), cur = normCur(get("currency"));
    if (!sku) errs.push("Falta código"); if (!name) errs.push("Falta nombre"); if (!(cost > 0)) errs.push("Costo inválido"); if (!cur) errs.push("Moneda no es PEN ni USD");
    const used = new Set(Object.values(m).filter(x => x !== "" && x != null).map(Number));
    const attributes = {}; CAT.headers.forEach((h, j) => { if (!used.has(j) && r[j] !== "" && r[j] != null) attributes[h.toLowerCase()] = r[j]; });
    if (attributes["energía"]) attributes.energy = String(attributes["energía"]).toLowerCase(); if (attributes["voltaje"]) attributes.voltage = String(attributes["voltaje"]).toUpperCase();
    return { row: i + 2, errs, p: { sku, name, description: String(get("description") ?? ""), category: String(get("category") || "Sin categoría"), brand: String(get("brand") ?? ""), unit: String(get("unit") || "und"), cost: round2(cost), currency: cur, attributes } };
  });
}
function handleFile(file) {
  if (!file) return;
  if (!window.XLSX) { toast("No se pudo cargar el lector de Excel. Revisa tu conexión."); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try {
      let wb;
      if (/\.csv$/i.test(file.name)) { const txt = new TextDecoder("utf-8").decode(fr.result); const sep = (txt.split("\n")[0].match(/;/g) || []).length > (txt.split("\n")[0].match(/,/g) || []).length ? ";" : ","; wb = XLSX.read(txt, { type: "string", FS: sep }); }
      else wb = XLSX.read(fr.result, { type: "array" });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: true }).filter(r => r.some(c => String(c).trim() !== ""));
      if (aoa.length < 2) { toast("El archivo no tiene filas de productos."); return; }
      CAT.headers = aoa[0].map(h => String(h).trim()); CAT.rows = aoa.slice(1); CAT.fileName = file.name;
      CAT.mapping = {}; MAP_FIELDS.forEach(([k, , , re]) => { const j = CAT.headers.findIndex((h, jj) => re.test(h) && !Object.values(CAT.mapping).includes(jj)); CAT.mapping[k] = j >= 0 ? j : ""; });
      CAT.stage = "map"; render();
    } catch (e) { toast("No se pudo leer el archivo. Usa .xlsx, .xls o .csv."); }
  };
  fr.readAsArrayBuffer(file);
}

function openAddProduct(qs = "") {
  const list = DB.products.filter(p => p.active && (!qs || (p.name + " " + p.sku + " " + p.brand + " " + p.category).toLowerCase().includes(qs.toLowerCase()))).slice(0, 40);
  const html = list.map(p => `<div class="pick"><div style="min-width:0"><b style="font-weight:600">${esc(p.name)}</b><br><small class="muted"><span class="mono">${esc(p.sku)}</span> · ${esc(p.brand)} · ${esc(p.category)}</small></div><div class="row" style="flex-wrap:nowrap"><span class="num muted" style="font-size:.85rem">${money(pricing.unitPrice(pricing.convert(p.cost, p.currency, W.currency, W.exchangeRate), W.defaultMargin), W.currency)}</span><button class="btn sm" data-act="add-pick" data-id="${p.id}">Agregar</button></div></div>`).join("") || `<p class="muted">Sin resultados.</p>`;
  if ($("#pick-list")) { $("#pick-list").innerHTML = html; return; }
  modal(`<header><h2>Agregar producto</h2><button class="iconbtn" data-act="modal-close" aria-label="Cerrar">${I.x}</button></header><div class="mb"><input class="input" id="pick-q" placeholder="Buscar en el catálogo" autocomplete="off"><div id="pick-list">${html}</div></div>`);
  setTimeout(() => $("#pick-q") && $("#pick-q").focus(), 30);
}

/* ============ eventos ============ */
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach(k => (o = o[k] = o[k] || {})); o[ks[ks.length - 1]] = val; }
const ACT = {
  "demo-catalog": () => { const keep = DB.products.length; DB.products = demoProducts(); saveDB(); toast(`${DB.products.length} productos de demostración cargados.`); render(); },
  "open-quote": t => { DB.ui.currentQuoteId = t.dataset.id; saveDB(); go("cotizacion"); },
  "dup-quote": t => { const o = store.quotes.get(t.dataset.id); const now = new Date().toISOString(); const q = Object.assign(clone(o), { id: uid(), number: nextNumber(), status: "Borrador", createdAt: now, updatedAt: now }); q.lines.forEach(l => (l.id = uid())); store.quotes.upsert(q); toast(`Duplicada como ${q.number}.`); render(); },
  "pdf-quote": t => { const q = store.quotes.get(t.dataset.id); DB.ui.currentQuoteId = q.id; saveDB(); askDownload(q); },
  "goto-step": t => { const n = +t.dataset.step; if (n > W.maxStep) return; if (W.step === 1 && n > 1) { if (!validateStep(1)) return render(); persistClient(); } errors = {}; setStep(n); },
  "back": () => { errors = {}; if (W.step > 1) setStep(W.step - 1); },
  "next": () => {
    if (!validateStep(W.step)) { render(); return; }
    if (W.step === 1) persistClient();
    if (W.step === 3 && W.ui3 === "c" && W.aiProposal) applyProposal();
    setStep(W.step + 1);
  },
  "save-draft": () => { if (W.client.name.trim()) persistClient(); store.quotes.upsert(W); toast(`Borrador ${W.number} guardado.`); },
  "currency": t => { const c = t.dataset.cur; if (c === W.currency) return; W.currency = c; pricing.recalc(W); store.quotes.upsert(W); render(); },
  "pick-client": t => { const c = store.clients.get(t.dataset.id); W.client = clone(c); W.clientId = c.id; errors = {}; store.quotes.upsert(W); render(); },
  "client-new": () => { W.client = emptyClient(); W.clientId = null; render(); },
  "prof": t => { W.businessProfile[t.dataset.q] = t.dataset.v; if (W.aiProposal) W.stale = true; errors = {}; store.quotes.upsert(W); render(); },
  "prof-multi": t => { const a = W.businessProfile[t.dataset.q] = W.businessProfile[t.dataset.q] || []; const i = a.indexOf(t.dataset.v); i >= 0 ? a.splice(i, 1) : a.push(t.dataset.v); if (W.aiProposal) W.stale = true; store.quotes.upsert(W); render(); },
  "chip": t => { const i = W.chips.indexOf(t.dataset.v); i >= 0 ? W.chips.splice(i, 1) : W.chips.push(t.dataset.v); if (W.aiProposal) W.stale = true; render(); },
  "analyze": () => runAnalyze(),
  "view-proposal": () => { W.ui3 = "c"; render(); },
  "back-3a": () => { W.ui3 = "a"; render(); },
  "back-3b": () => { if (W.aiConversation.some(r => r.questions.length)) { const rounds = W.aiConversation.filter(r => r.questions.length); W.aiPending = rounds[rounds.length - 1].questions; W.aiRound = rounds.length; W.ui3 = "b"; } else W.ui3 = "a"; render(); },
  "ai-opt": t => { const id = t.dataset.q, v = t.dataset.v; if (t.dataset.multi === "true") { let a = Array.isArray(W.aiAnswers[id]) ? W.aiAnswers[id] : []; a = a.includes(v) ? a.filter(x => x !== v) : a.concat(v); W.aiAnswers[id] = a; } else W.aiAnswers[id] = W.aiAnswers[id] === v ? null : v; render(); },
  "ai-skip": t => { W.aiAnswers[t.dataset.q] = W.aiAnswers[t.dataset.q] === "__skip" ? null : "__skip"; render(); },
  "propose": () => runPropose(),
  "regen": () => { W.stale = false; runRecommend(); },
  "keep-proposal": () => { W.stale = false; render(); },
  "pl-toggle": t => { W.aiProposal.lines[+t.dataset.i].selected = t.checked; store.quotes.upsert(W); rerender(); },
  "del-line": t => { W.lines.splice(+t.dataset.i, 1); store.quotes.upsert(W); render(); },
  "add-product": () => openAddProduct(),
  "add-pick": t => { const p = store.products.get(t.dataset.id); W.lines.push(makeLine(W, p, 1, { source: "manual" })); errors = {}; store.quotes.upsert(W); modal(""); render(); toast(`${p.name} agregado.`); },
  "modal-close": () => modal(""),
  "modal-bg": (t, e) => { if (e.target === t) modal(""); },
  "download-pdf": () => askDownload(W),
  "dl-only": () => { modal(""); downloadPdf(store.quotes.get(DB.ui.currentQuoteId), false); },
  "dl-sent": () => { modal(""); downloadPdf(store.quotes.get(DB.ui.currentQuoteId), true); },
  "mark-sent": () => { W.status = "Enviada"; store.quotes.upsert(W); toast(`${W.number} marcada como Enviada.`); render(); },
  "pick-file": () => $("#file-input").click(),
  "cat-cancel": () => { CAT.stage = "list"; render(); },
  "cat-mode": t => { CAT.mode = t.dataset.v; render(); },
  "cat-import": () => doImport(),
  "cat-dismiss": () => { CAT.stage = "list"; CAT.result = null; render(); },
  "tpl-download": () => { if (!window.XLSX) return toast("No se pudo cargar el generador de Excel."); saveFile("plantilla_lista_de_precios.xlsx", templateXlsx()); },
  "toggle-active": t => { const p = store.products.get(t.dataset.id); p.active = t.checked; saveDB(); rerender(); },
  "ed-start": t => { CAT.editing = t.dataset.id; render(); },
  "ed-cancel": () => { CAT.editing = null; render(); },
  "ed-save": t => { const p = store.products.get(t.dataset.id); const cost = parseNum($("#ed-cost").value); if (!(cost > 0)) return toast("El costo debe ser un número positivo."); Object.assign(p, { name: $("#ed-name").value.trim() || p.name, category: $("#ed-cat").value, brand: $("#ed-brand").value.trim(), currency: $("#ed-cur").value, cost: round2(cost) }); CAT.editing = null; saveDB(); toast("Producto actualizado."); render(); },
  "save-settings": () => { saveDB(); toast("Configuración guardada."); render(); },
  "pick-logo": () => $("#logo-input").click(),
  "del-logo": () => { DB.settings.logo = ""; saveDB(); render(); },
  "reset-ask": () => { confirmReset = true; render(); },
  "reset-cancel": () => { confirmReset = false; render(); },
  "reset-demo": () => { confirmReset = false; seedDB(); W = null; CAT.stage = "list"; toast("Datos de demostración restablecidos."); go("inicio"); },
  "clear-catalog": () => { DB.products = []; saveDB(); toast("Catálogo vaciado."); go("inicio"); },
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act; if (!ACT[a]) return;
  if (t.tagName === "INPUT" && t.type === "checkbox") { ACT[a](t, e); return; }
  if (a === "modal-bg" && e.target !== t) return;
  e.preventDefault(); ACT[a](t, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "cli-search") return renderClientResults(t.value);
  if (t.id === "cat-q") { CAT.q = t.value; return rerenderCatalogTable(); }
  if (t.id === "pick-q") return openAddProduct(t.value);
  if (t.dataset.bind && W) {
    const v = t.dataset.num !== undefined ? (t.value === "" ? "" : +t.value) : t.value;
    setPath(W, t.dataset.bind, v);
    if (t.dataset.bind === "client.documentType") rerender();
    if ((t.dataset.bind.startsWith("businessProfile") || t.dataset.bind === "needsText") && W.aiProposal) W.stale = true;
    if (t.dataset.bind === "needsText") { const b = $('[data-act="analyze"]'); if (b) b.disabled = !(t.value.trim() || W.chips.length); }
    clearTimeout(ACT._s); ACT._s = setTimeout(() => store.quotes.upsert(W), 400);
  }
  if (t.dataset.set) { DB.settings[t.dataset.set] = t.dataset.num !== undefined ? +t.value : t.value; clearTimeout(ACT._s2); ACT._s2 = setTimeout(saveDB, 400); }
  if (t.dataset.aiOther) { const id = t.dataset.aiOther, q = (W.aiPending || []).find(x => x.id === id), v = t.value.trim(); let cur = W.aiAnswers[id];
    if (t.dataset.multi === "true") { cur = (Array.isArray(cur) ? cur : []).filter(x => q.options.includes(x)); if (v) cur.push(v); W.aiAnswers[id] = cur; } else W.aiAnswers[id] = v || null;
    document.querySelectorAll(`[data-act="ai-opt"][data-q="${id}"]`).forEach(b => b.setAttribute("aria-pressed", t.dataset.multi === "true" ? String((W.aiAnswers[id] || []).includes(b.dataset.v)) : "false")); }
  if (t.dataset.aiNum) W.aiAnswers[t.dataset.aiNum] = t.value === "" ? null : +t.value;
});
function rerenderCatalogTable() { clearTimeout(rerenderCatalogTable._t); rerenderCatalogTable._t = setTimeout(rerender, 180); }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "c-doctype") { W.client.documentType = t.value; rerender(); return; }
  if (t.id === "cat-cat") { CAT.cat = t.value; return render(); }
  if (t.id === "cat-cur") { CAT.cur = t.value; return render(); }
  if (t.dataset.map) { CAT.mapping[t.dataset.map] = t.value === "" ? "" : +t.value; return render(); }
  if (t.dataset.status) { const q = store.quotes.get(t.dataset.status); q.status = t.value; store.quotes.upsert(q); toast(`${q.number}: ${q.status}`); return render(); }
  if (t.dataset.set === "defaultCurrency") { DB.settings.defaultCurrency = t.value; saveDB(); return; }
  if (t.dataset.plq) { const l = W.aiProposal.lines[+t.dataset.plq]; l.quantity = Math.max(1, Math.round(+t.value || 1)); store.quotes.upsert(W); return rerender(); }
  if (t.dataset.line) {
    const l = W.lines[+t.dataset.line], v = +t.value;
    if (t.dataset.f === "quantity") l.quantity = Math.max(1, Math.round(v || 1));
    if (t.dataset.f === "margin") l.marginOverride = isFinite(v) ? v : null;
    if (t.dataset.f === "unitPrice" && v > 0) l.marginOverride = pricing.marginFrom(round2(v), l.unitCost);
    pricing.recalcLine(W, l); store.quotes.upsert(W); return rerender();
  }
  if (t.dataset.bind && W && t.dataset.rerender !== undefined) { if (t.dataset.bind === "exchangeRate" || t.dataset.bind === "defaultMargin") pricing.recalc(W); if (t.dataset.bind === "discount") W.discount = Math.min(100, Math.max(0, +t.value || 0)); store.quotes.upsert(W); return rerender(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").innerHTML) modal(""); });
$("#file-input").addEventListener("change", e => { handleFile(e.target.files[0]); e.target.value = ""; });
$("#logo-input").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { DB.settings.logo = fr.result; saveDB(); render(); toast("Logo actualizado."); }; fr.readAsDataURL(f); e.target.value = ""; });
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("hover"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("hover"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("hover"); handleFile(e.dataTransfer.files[0]); } });
function bindDrag() {
  const box = $("#lines"); if (!box) return; let from = null;
  box.querySelectorAll(".lrow[data-idx]").forEach(r => {
    r.addEventListener("dragstart", e => { if (/INPUT|BUTTON/.test(document.activeElement.tagName) && r.contains(document.activeElement)) { e.preventDefault(); return; } from = +r.dataset.idx; r.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    r.addEventListener("dragend", () => r.classList.remove("dragging"));
    r.addEventListener("dragover", e => { e.preventDefault(); r.classList.add("over"); });
    r.addEventListener("dragleave", () => r.classList.remove("over"));
    r.addEventListener("drop", e => { e.preventDefault(); const to = +r.dataset.idx; if (from == null || from === to) return; const [m] = W.lines.splice(from, 1); W.lines.splice(to, 0, m); store.quotes.upsert(W); render(); });
  });
}
render();
</script>
